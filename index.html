    <script>
    var _infoContent = {
        about: '<p><strong>Boxters</strong> is a word puzzle game where you trace paths across a hexagonal board to form words. Sharpen your vocabulary, test your spatial reasoning, and discover words you never knew existed.</p><p>Challenge yourself across four unique game modes \u2014 Simple, Clear, Chain, and Illuminate \u2014 each with its own twist on word-finding strategy. Complete each mode to unlock the next!</p><h3 style="color:#ffd700; margin-top:1rem;">Quick Tips</h3><ul><li>Longer words score more points \u2014 a 6-letter word is worth far more than two 3-letter words.</li><li>Scan the entire board before tracing. The best path isn\u2019t always the most obvious one.</li><li>Common prefixes and suffixes (<em>-ing</em>, <em>-tion</em>, <em>re-</em>, <em>un-</em>) can help you spot longer words.</li><li>Edge tiles are harder to connect later \u2014 use them early when you can.</li><li>Don\u2019t waste moves on guesses. Invalid words (not in the dictionary) still cost a move!</li></ul><p style="margin-top:1rem; font-size:0.85rem; color:rgba(192,192,220,0.7);">Built with HTML5 Canvas. 170,000+ word dictionary. No internet required.</p><p style="margin-top:0.5rem; color: rgba(255,215,0,0.6); font-size:0.8rem;">Version 1.1.0</p>',
        gameplay: '<h3>Basics</h3><ul><li>Trace a path through adjacent hexagonal tiles to spell a word (minimum 3 letters).</li><li>Each tile can only be used once per word.</li><li>Words must be in the dictionary to count.</li><li>Invalid words (3+ letters, not in dictionary) cost a move.</li></ul><h3>Modes</h3><ul><li><strong>Simple</strong> \u2014 Form the required words to complete each level. Tiles stay on the board and can be reused across words.</li><li style="color:rgba(255,215,0,0.7); font-size:0.82rem; margin-left:1rem;"><em>Tip: Focus on longer words for higher scores. Plan your path before tracing.</em></li><li><strong>Clear</strong> \u2014 Sweep the board clean. Each word you form removes those tiles from the board.</li><li style="color:rgba(255,215,0,0.7); font-size:0.82rem; margin-left:1rem;"><em>Tip: If only 1\u20132 tiles remain in a cluster with no valid word, the game auto-clears them for you.</em></li><li><strong>Chain</strong> \u2014 Form words one at a time. After each word, the tiles you used get new random letters. To build combos, make your next word pass through the same tile positions (shown with a blue pulse). Chain consecutive words to increase your multiplier.</li><li style="color:rgba(255,215,0,0.7); font-size:0.82rem; margin-left:1rem;"><em>Tip: If the blue tiles don\u2019t form a usable word, play elsewhere \u2014 you\u2019ll lose the combo but can start a new chain.</em></li><li><strong>Illuminate</strong> \u2014 Light up the board. Each word permanently illuminates the tiles it passes through. Cover every tile to win.</li><li style="color:rgba(255,215,0,0.7); font-size:0.82rem; margin-left:1rem;"><em>Tip: Prioritize unlit tiles at the edges \u2014 they\u2019re harder to reach later.</em></li></ul><h3>Anchors</h3><p>Some levels have <strong style="color:#ff6b6b;">Anchor cells</strong> (red rim). Every word you form must pass through an Anchor tile.</p><h3>Scoring</h3><ul><li>Points are based on letter values and word length.</li><li>Harder modes have higher score multipliers.</li><li>Earn 1\u20133 stars per level based on your score.</li></ul><h3>Lives</h3><p>You start with 3 lives. Failing a level costs a life. Lose all 3 lives and you\u2019ll need to wait 5 minutes before retrying with fresh lives.</p>',
        changelog: '<h3>v1.1.0 <span style="color:rgba(192,192,220,0.5); font-size:0.8rem; font-weight:normal;">\u2014 August 5, 2026</span></h3><ul><li><strong>Mode progression</strong> \u2014 Complete each mode to unlock the next (Simple \u2192 Clear \u2192 Chain \u2192 Illuminate).</li><li><strong>Sound effects</strong> \u2014 Fail SFX on defeat, clapping on victory, and a special victory fanfare for mode completion.</li><li><strong>Mode completion celebration</strong> \u2014 Confetti, special audio, and unique title for completing all 14 levels of a mode.</li><li><strong>Solution panel</strong> \u2014 Now shows shorter words (3\u20135 letters) in Illuminate mode, sorted by unlit tile coverage. Panel is more translucent so the board is visible behind it.</li><li><strong>Unlit tile pulsing</strong> \u2014 After defeat in Illuminate, remaining unlit tiles pulsate red.</li><li><strong>Board visibility</strong> \u2014 Defeat and game-over overlays are lighter so the board stays visible.</li><li><strong>Tutorial updates</strong> \u2014 Illuminate level tutorials no longer reference specific move counts.</li><li><strong>Version footer</strong> \u2014 Version number displayed at the bottom of every screen.</li></ul><h3>v1.0.0 <span style="color:rgba(192,192,220,0.5); font-size:0.8rem; font-weight:normal;">\u2014 August 1, 2026</span></h3><ul><li>Initial release with four game modes (Simple, Clear, Chain, Illuminate), 56 levels, hex grid boards, anchor cells, scoring with star ratings, lives system, and local save.</li></ul>',
        privacy: '<h3>Privacy Policy</h3><p><strong>Effective Date:</strong> August 1, 2026</p><p>Boxters is committed to protecting your privacy. This policy explains what data is stored, how it is used, and your rights regarding that data.</p><h3>Data Collection</h3><p>Boxters does <strong>not</strong> collect, transmit, or share any personal information. The game operates entirely within your browser with no server-side component.</p><ul><li><strong>No personal data</strong> is collected, processed, or sent to any server.</li><li><strong>No cookies</strong> are used.</li><li><strong>No analytics, tracking, or telemetry</strong> of any kind.</li><li><strong>No third-party services</strong> or advertising SDKs are integrated.</li><li><strong>No account creation</strong> or internet connection is required to play.</li></ul><h3>Local Storage</h3><p>Your game progress (player name, scores, level progress, and settings) is stored locally in your browser using the Web Storage API (<code style="color:#ffd700;">localStorage</code>). This data:</p><ul><li>Never leaves your device.</li><li>Is accessible only to you within this browser.</li><li>Is not shared across devices, browsers, or profiles.</li><li>Can be cleared at any time (see below).</li></ul><h3>Your Rights</h3><p>You have full control over your data:</p><ul><li><strong>Access:</strong> Your data is stored in your browser and visible to you at any time.</li><li><strong>Deletion:</strong> Clear all saved data by opening your browser\'s developer console (F12) and running:<br><code style="color:#ffd700; display:inline-block; margin-top:0.3rem;">localStorage.removeItem(\'boxters_player\')</code></li><li><strong>Portability:</strong> No cloud data exists to export \u2014 all data is local.</li></ul><h3>Children\'s Privacy</h3><p>Boxters does not collect data from any user, including children. The game is safe for players of all ages.</p><h3>Changes to This Policy</h3><p>Any updates to this privacy policy will be reflected here with a revised effective date.</p><p style="margin-top:1rem; color:rgba(192,192,220,0.5); font-size:0.8rem;">Last updated: August 5, 2026</p>'
    };
    function showInfoTab(tab) {
        var body = document.getElementById('info-dialog-body');
        var tabs = document.querySelectorAll('#info-dialog .info-tab');
        body.innerHTML = _infoContent[tab] || _infoContent.about;
        tabs.forEach(function(t) { t.classList.toggle('active', t.dataset.tab === tab); });
    }
    function showInfoDialog(tab) {
        showInfoTab(tab);
        document.getElementById('info-dialog').showModal();
    }
    </script>
</head>
<body>
    <div id="game-container">
        <canvas id="game-canvas"></canvas>


        <div id="loading-screen">
            <h1 class="title">Boxters</h1>
            <p class="tagline">Find words. Unlock modes. Master the board.</p>
            <div class="loader"></div>
        </div>

        <div id="register-screen" class="overlay hidden">
            <h1 class="title">Boxters</h1>
            <p class="tagline">Find words. Unlock modes. Master the board.</p>
            <form id="register-form" autocomplete="off">
                <label for="player-name">Enter your name</label>
                <input type="text" id="player-name" maxlength="20" placeholder="Stargazer" required>
                <button type="submit" class="btn-primary">Begin Journey</button>
            </form>
        </div>

        <div id="welcome-screen" class="overlay hidden">
            <img src="favicon.svg" alt="" class="welcome-logo">
            <h1 class="title">Boxters</h1>
            <p class="welcome-greeting">Welcome back, <span id="welcome-name"></span></p>
            <div class="player-stats">
                <div class="stat"><span class="stat-value" id="stat-games">0</span><span class="stat-label">Games</span></div>
                <div class="stat"><span class="stat-value" id="stat-levels">0</span><span class="stat-label">Levels</span></div>
                <div class="stat"><span class="stat-value" id="stat-score">0</span><span class="stat-label">Best Score</span></div>
            </div>
            <div id="mode-select" class="mode-buttons"></div>
            <button id="play-btn" class="btn-primary">Play</button>
            <button id="info-btn" class="info-btn" aria-label="Info" type="button" onclick="showInfoDialog('about')" style="margin-top: 2rem;">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"/>
                    <line x1="12" y1="16" x2="12" y2="12"/>
                    <line x1="12" y1="8" x2="12.01" y2="8"/>
                </svg>
            </button>
        </div>

        <div id="solution-modal" class="hidden">
            <div class="solution-panel">
                <h2 class="solution-title">Words You Could Have Played</h2>
                <div id="solution-word-list" class="solution-words"></div>
                <p class="solution-hint">Hover over a word to see its path</p>
                <button id="solution-continue-btn" class="btn-primary">Continue</button>
            </div>
        </div>
    </div>

    <dialog id="info-dialog">
        <div class="info-dialog-inner">
            <div class="info-tabs">
                <button class="info-tab active" data-tab="about" type="button" onclick="showInfoTab('about')">About</button>
                <button class="info-tab" data-tab="gameplay" type="button" onclick="showInfoTab('gameplay')">Game Play</button>
                <button class="info-tab" data-tab="changelog" type="button" onclick="showInfoTab('changelog')">Changelog</button>
                <button class="info-tab" data-tab="privacy" type="button" onclick="showInfoTab('privacy')">Privacy</button>
            </div>
            <div id="info-dialog-body"></div>
            <button class="btn-primary" type="button" onclick="document.getElementById('info-dialog').close()">Close</button>
        </div>
    </dialog>

    <script type="module" src="js/main.js?v=43"></script>
</body>
</html>
